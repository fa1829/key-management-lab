# Prometheus scrapes the lab exporter every 15 s and evaluates alert-rules.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert-rules.yml
scrape_configs:
  - job_name: crypto-exporter
    static_configs:
      - targets: ["localhost:9105"]
        labels:
          lab: key-management-lab
